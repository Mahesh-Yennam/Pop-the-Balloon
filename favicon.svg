<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Sky Background Gradient -->
    <radialGradient id="skyGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <!-- Glossy Red Balloon Gradient -->
    <radialGradient id="balloonRed" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff8787"/>
      <stop offset="40%" stop-color="#ff4757"/>
      <stop offset="90%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#801010"/>
    </radialGradient>
    <filter id="popGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky Circle Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#skyGrad)" stroke="#fde047" stroke-width="2.5"/>

  <!-- Soft White Cloud Silhouette at Bottom -->
  <path d="M12 48 Q16 42 22 44 Q28 36 38 40 Q46 38 50 44 Q54 48 50 54 L14 54 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Balloon & String Group -->
  <g filter="url(#popGlow)">
    <!-- Wavy Dangling String -->
    <path d="M32 44 Q30 50 34 54 T31 60" stroke="#f1f5f9" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Balloon Knot -->
    <polygon points="30,44 34,44 32,41" fill="#c0392b"/>

    <!-- Main Balloon Oval -->
    <ellipse cx="32" cy="27" rx="14" ry="17" fill="url(#balloonRed)"/>

    <!-- Specular Highlight Sheen (3D glossy shine) -->
    <ellipse cx="26" cy="19" rx="3.5" ry="6" transform="rotate(-25 26 19)" fill="#ffffff" opacity="0.65"/>
    <circle cx="29" cy="14" r="1.2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Confetti Pop Sparkles -->
  <path d="M47 16 L49 19 L52 20 L49 21 L47 24 L45 21 L42 20 L45 19 Z" fill="#fde047"/>
  <circle cx="16" cy="18" r="1.8" fill="#fde047"/>
  <circle cx="48" cy="36" r="1.5" fill="#ffffff"/>
</svg>
